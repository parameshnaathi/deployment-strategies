apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-blue-green
  namespace: deployment-lab
spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-blue
                port:
                  number: 80
