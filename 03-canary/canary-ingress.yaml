apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-canary
  namespace: deployment-lab
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-v2
                port:
                  number: 80
