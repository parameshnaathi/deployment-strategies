apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-stable
  namespace: deployment-lab
spec:
  ingressClassName: nginx
  rules:
    - host: demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-v1
                port:
                  number: 80
