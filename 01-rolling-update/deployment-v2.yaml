apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: deployment-lab
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "V2"
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '<html><body><h1>Deployment Strategy Lab</h1><h2>Version: %s</h2><p>Pod: %s</p></body></html>\n' "$APP_VERSION" "$HOSTNAME" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
